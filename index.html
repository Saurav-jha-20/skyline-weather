<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skyline — Live Weather Station</title>
  <meta name="description" content="A live weather lookup station powered by OpenWeatherMap." />

  <!-- Fonts: Space Grotesk (display), Inter (body), IBM Plex Mono (data readouts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ============ HEADER ============ -->
  <header class="site-header">
    <div class="wrap header-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 15a4 4 0 0 1 .5-7.97A5.5 5.5 0 0 1 17 8.5a3.5 3.5 0 0 1-.5 6.98H6Z" fill="currentColor"/></svg>
        </span>
        <span class="brand-name">Skyline</span>
        <span class="brand-tag">Weather Station</span>
      </div>
      <div class="header-time" id="localClock">--:--</div>
    </div>
  </header>

  <!-- ============ HERO / INSTRUMENT PANEL ============ -->
  <main>
    <section class="hero">
      <div class="wrap">

        <form class="search-bar" id="searchForm" autocomplete="off">
          <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/>
            <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input type="text" id="cityInput" placeholder="Search a city — try Mumbai, London, Tokyo..." aria-label="City name" />
          <button type="submit">Check sky</button>
          <button type="button" id="geoBtn" title="Use my current location" aria-label="Use my current location">
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 2v3M12 19v3M2 12h3M19 12h3M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
          </button>
        </form>

        <div id="statusMsg" class="status-msg" role="status"></div>

        <div class="panel" id="weatherPanel" hidden>
          <div class="panel-main">

            <!-- Dial gauge: signature element, needle position set by JS via --deg -->
            <div class="gauge-wrap">
              <svg class="gauge" viewBox="0 0 220 220" aria-hidden="true">
                <defs>
                  <linearGradient id="gaugeArc" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#4F8A8B"/>
                    <stop offset="50%" stop-color="#C7D0DC"/>
                    <stop offset="100%" stop-color="#E8A33D"/>
                  </linearGradient>
                </defs>
                <circle cx="110" cy="110" r="92" class="gauge-track"/>
                <path class="gauge-arc" d="M 30 160 A 92 92 0 1 1 190 160" stroke="url(#gaugeArc)"/>
                <g class="gauge-needle" id="gaugeNeedle">
                  <line x1="110" y1="110" x2="110" y2="34" />
                  <circle cx="110" cy="110" r="7" />
                </g>
              </svg>
              <div class="gauge-readout">
                <span class="temp-value" id="tempValue">--</span>
                <span class="temp-unit">°C</span>
              </div>
            </div>

            <div class="condition-block">
              <div class="condition-icon" id="conditionIcon"></div>
              <h1 class="city-name" id="cityName">—</h1>
              <p class="condition-desc" id="conditionDesc">—</p>
              <p class="feels-like">Feels like <span id="feelsLike">--</span>°C</p>
            </div>
          </div>

          <!-- Stat cards -->
          <div class="stats-grid">
            <div class="stat-card">
              <span class="stat-label">Humidity</span>
              <span class="stat-value" id="statHumidity">--<small>%</small></span>
            </div>
            <div class="stat-card">
              <span class="stat-label">Wind</span>
              <span class="stat-value" id="statWind">--<small>km/h</small></span>
            </div>
            <div class="stat-card">
              <span class="stat-label">Pressure</span>
              <span class="stat-value" id="statPressure">--<small>hPa</small></span>
            </div>
            <div class="stat-card">
              <span class="stat-label">Visibility</span>
              <span class="stat-value" id="statVisibility">--<small>km</small></span>
            </div>
            <div class="stat-card">
              <span class="stat-label">Dew Point</span>
              <span class="stat-value" id="statDewPoint">--<small>°C</small></span>
            </div>
            <div class="stat-card">
              <span class="stat-label">Sunrise</span>
              <span class="stat-value" id="statSunrise">--:--</span>
            </div>
            <div class="stat-card">
              <span class="stat-label">Sunset</span>
              <span class="stat-value" id="statSunset">--:--</span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ HOURLY TREND ============ -->
    <section class="hourly-section" id="hourlySection" hidden>
      <div class="wrap">
        <h2 class="section-title">Next 24 Hours</h2>
        <div class="hourly-chart-card">
          <svg id="hourlyChart" class="hourly-chart" viewBox="0 0 760 140" preserveAspectRatio="none" aria-hidden="true"></svg>
        </div>
        <div class="hourly-strip" id="hourlyStrip"></div>
      </div>
    </section>

    <!-- ============ FORECAST STRIP ============ -->
    <section class="forecast-section" id="forecastSection" hidden>
      <div class="wrap">
        <h2 class="section-title">5-Day Outlook</h2>
        <div class="forecast-strip" id="forecastStrip"></div>
      </div>
    </section>
  </main>

  <!-- ============ FOOTER ============ -->
  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p>Built by <span id="footerAuthor">a student</span> as a field project. Weather data by <a href="https://openweathermap.org/" target="_blank" rel="noopener">OpenWeatherMap</a>.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
